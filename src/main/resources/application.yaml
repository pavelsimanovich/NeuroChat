spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  web:
    resources:
      static-locations: "classpath:/static/"
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  application:
    name: ollama-ai
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma3:4b
          temperature: 1
          num-ctx: 65536
          keep-alive: 30s
  datasource:
    url: jdbc:mysql://${MYSQL_URL:localhost}:3306/llama_ai_chat_app
    username: ${MYSQL_ROOT_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:123456789}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  mail:
    host: smtp.mail.ru
    port: 465
    username:
    password:
    properties:
      "mail.smtp.auth": true
      "mail.smtp.ssl.enable": true

app:
  chat-limit: 100
  url: http://localhost:8080

server:
  http2:
    enabled: true

logging:
  level:
    org.springframework.web: debug
    org.hibernate: error
