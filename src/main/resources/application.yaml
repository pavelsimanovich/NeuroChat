spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  web:
    resources:
      static-locations: "classpath:/static/,file:${file.upload-dir:upload}"
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  application:
    name: ollama-ai
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma3:12b
          temperature: 1
          num-ctx: 32768
          keep-alive: 2s
  datasource:
    url: jdbc:mysql://${MYSQL_URL:localhost}:3306/llama_ai_chat_app
    username: ${MYSQL_ROOT_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:123456789}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

logging:
  level:
    org.springframework.web: debug
    org.hibernate: error

app:
  chat-limit: 100
  file:
    upload-dir: ${UPLOAD_DIR:src/main/resources/upload/}

server:
  http2:
    enabled: true