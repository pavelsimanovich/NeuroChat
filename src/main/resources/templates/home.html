<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Чат</title>
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css" />
    <link th:href="@{/css/lib/prism.css}" rel="stylesheet" />
    <link th:href="@{/css/chat.css}" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>

<input type="hidden" id="userId" th:value="${userId}" >
<input type="hidden" id="userName" th:value="${userName}" >
<input type="hidden" id="modelName" th:value="${modelName}" >

<div class="container-fluid">
    <div class="row">
        <!-- Сайдбар с комнатами -->
        <div class="col-md-3 sidebar">
            <div class="sidebar-header">
                <h4>Мои чаты</h4>
                <button id="createRoomBtn" class="btn btn-primary btn-sm">+ Новая комната</button>
            </div>
            <div id="roomsList" class="rooms-list">
                <!-- Список комнат будет загружен здесь -->
            </div>

            <div id="logout" class="logout">
                <a style="color: #656e79" th:text="${'Based on ' + modelName}"></a>
                <form th:action="@{/logout}" method="post">
                    <input type="submit" value="Выход" class="btn btn-link"/>
                </form>
            </div>

        </div>

        <!-- Основная область чата -->
        <div class="col-md-9 chat-area">
            <div class="chat-header d-flex justify-content-between align-items-center">
                <h4 id="currentRoomTitle" th:text="${userName + ' Выберите или создайте чат'}"></h4>
                <button id="toggleSearch" class="btn btn-link text-decoration-none">
                    <i class="bi bi-search"></i>
                </button>
            </div>
            <div class="search-bar mb-3 d-none">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Поиск сообщений...">
                    <button id="searchButton" class="btn btn-outline-secondary" type="button">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>
            <div class="search-results d-none" id="searchResults"></div>

            <!-- Контейнер для уведомлений -->
            <div id="toastContainer" class="toast-container"></div>

            <!-- Индикатор загрузки -->
            <div id="loadingOverlay" class="loading-overlay">
                <div class="loading-spinner"></div>
            </div>

            <div id="chatMessages" class="chat-messages">
                <!-- Сообщения будут отображаться здесь -->
            </div>
            <div id="limitMessages"></div>
            <div id="typingIndicatorContainer" style="display: none; min-height: 40px; padding-top: 15px">
                <div class="typing-indicator">
                    <div class="typing-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <span>AI работает над ответом...</span>
                </div>
            </div>

            <div id="error"></div>

            <div class="message-input">
                <!-- File preview container -->
                <div id="filePreview" class="file-preview-container"></div>
                
                <div class="message-input-wrapper">
                    <!-- Message input area -->
                    <div class="message-input-container" id="messageInputContainer">
                        <!-- File input (hidden) -->
                        <input type="file" id="fileInput" multiple>
                        
                        <!-- Upload button -->
                        <button type="button" id="uploadButton" title="Прикрепить файл">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-paperclip" viewBox="0 0 16 16">
                                <path d="M4.5 3a2.5 2.5 0 0 1 5 0v9a1.5 1.5 0 0 1-3 0V5a.5.5 0 0 1 1 0v7a.5.5 0 0 0 1 0V3a1.5 1.5 0 1 0-3 0v9a2.5 2.5 0 0 0 5 0V5a.5.5 0 0 1 1 0v7a3.5 3.5 0 1 1-7 0V3z"/>
                            </svg>
                        </button>
                        
                        <!-- Text input -->
                        <textarea id="messageInput" placeholder="Чем я могу помочь Вам сегодня?" rows="1"></textarea>
                        
                        <!-- Send button -->
                        <button type="button" id="sendMessageBtn" title="Отправить сообщение">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-send" viewBox="0 0 16 16">
                                <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11zM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493z"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно создания комнаты -->
<div class="modal fade" id="createRoomModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Создать новую комнату</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="roomTitleInput" class="form-label">Название комнаты</label>
                    <input type="text" class="form-control" id="roomTitleInput">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" id="confirmCreateRoom">Создать</button>
            </div>
        </div>
    </div>
</div>

<!--JS libraries-->
<script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
<script th:src="@{/js/lib/marked.min.js}" type="text/javascript"></script>
<script th:src="@{/js/lib/prism.js}" type="text/javascript"></script>

<!--<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>-->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!--User scripts-->
<script type="text/javascript" th:src="@{/js/chat.js}"></script>
<script type="text/javascript" th:src="@{/js/search.js}"></script>

</body>
</html>
