<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменение пароля</title>
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reset-form {
            max-width: 450px;
            width: 100%;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            background-color: white;
        }
        .form-icon {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .form-icon i {
            font-size: 3rem;
            color: #6c757d;
        }
        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="reset-form">
                    <div class="form-icon">
                        <i class="bi bi-shield-lock"></i>
                    </div>

                    <h2 class="text-center mb-4">Создание нового пароля</h2>

                    <p class="text-muted mb-4">
                        Введите новый пароль для вашей учетной записи. Пароль должен содержать не менее 8 символов.
                    </p>

                    <form th:action="@{/reset-password}" method="post" th:object="${resetPasswordRequest}">
                        <input type="hidden" th:field="*{token}">

                        <div class="mb-3">
                            <label for="password" class="form-label">Новый пароль</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" th:field="*{password}" 
                                       placeholder="Введите новый пароль" required minlength="8">
                                <button type="button" class="btn btn-outline-secondary toggle-password" tabindex="-1">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="password-strength w-100 bg-light" id="passwordStrength"></div>
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Подтверждение пароля</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-check-circle"></i></span>
                                <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" 
                                       placeholder="Подтвердите новый пароль" required>
                                <button type="button" class="btn btn-outline-secondary toggle-password" tabindex="-1">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Изменить пароль</button>
                            <a th:href="@{/login}" class="btn btn-outline-secondary">Вернуться к входу</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
    <script>
        // Toggle password visibility
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('i');

                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('bi-eye');
                    icon.classList.add('bi-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('bi-eye-slash');
                    icon.classList.add('bi-eye');
                }
            });
        });

        // Password strength indicator
        const passwordInput = document.getElementById('password');
        const strengthIndicator = document.getElementById('passwordStrength');

        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strength = calculatePasswordStrength(password);

            let color;
            if (strength === 0) {
                color = 'transparent';
            } else if (strength < 40) {
                color = '#dc3545'; // red
            } else if (strength < 70) {
                color = '#ffc107'; // yellow
            } else {
                color = '#198754'; // green
            }

            strengthIndicator.style.width = strength + '%';
            strengthIndicator.style.backgroundColor = color;
        });

        function calculatePasswordStrength(password) {
            if (!password) return 0;

            let strength = 0;

            // Length
            if (password.length >= 8) {
                strength += 20;
                if (password.length >= 12) strength += 10;
            }

            // Contains lowercase
            if (/[a-z]/.test(password)) strength += 15;

            // Contains uppercase
            if (/[A-Z]/.test(password)) strength += 15;

            // Contains numbers
            if (/[0-9]/.test(password)) strength += 15;

            // Contains special chars
            if (/[^A-Za-z0-9]/.test(password)) strength += 15;

            // Mix of characters
            if (password.length >= 12 && 
                /[A-Z]/.test(password) && 
                /[a-z]/.test(password) && 
                /[0-9]/.test(password) && 
                /[^A-Za-z0-9]/.test(password)) {
                strength += 10;
            }

            return Math.min(strength, 100);
        }
    </script>
</body>
</html>
