<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация</title>
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
    <script src="/webjars/jquery/jquery.min.js"></script>
</head>

<style>
    .gradient-custom {
        background: #6a11cb;
        /* Chrome 10-25, Safari 5.1-6 */
        background: -webkit-linear-gradient(to right, rgba(106, 17, 203, 1), rgba(37, 117, 252, 1));
        /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
        background: linear-gradient(to right, rgba(106, 17, 203, 1), rgba(37, 117, 252, 1))
    }

    .icons-padding {
        padding-right: 10px;
    }
</style>

<body>

<section class="vh-100 gradient-custom">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card bg-dark text-white" style="border-radius: 1rem;">
                    <div class="card-body p-5 text-center">

                        <div class="mb-md-5 mt-md-4">

                            <h2 class="fw-bold mb-3  text-uppercase">Регистрация</h2>

                            <form th:action="@{/saveUser}" method="post" th:object="${user}">

                                <div data-mdb-input-init class="form-outline form-white mb-4">
                                    <input name="email" type="email" id="typeEmailX" class="form-control" />
                                    <label class="form-label" for="typeEmailX">Email</label>
                                </div>

                                <div data-mdb-input-init class="form-outline form-white mb-4">
                                    <input name="password" type="password" id="typePasswordX" class="form-control " />
                                    <label class="form-label" for="typePasswordX">Пароль</label>
                                </div>

                                <div data-mdb-input-init class="form-outline form-white mb-4">
                                    <input name="firstName" type="text" id="firstName" class="form-control " />
                                    <label class="form-label" for="firstName">Имя</label>
                                </div>

                                <div data-mdb-input-init class="form-outline form-white mb-4">
                                    <input name="lastName" type="text" id="lastName" class="form-control " />
                                    <label class="form-label" for="lastName">Фамилия</label>
                                </div>

                                <button data-mdb-button-init data-mdb-ripple-init class="btn btn-outline-light btn-lg px-5"
                                        type="submit">Зарегистрироваться</button>
                            </form>

                            <br/>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
