<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="index.title">Вход в ИИ чат</title>
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/index.css}" rel="stylesheet" />
</head>

<body>
<div class="container-fluid auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <!--                <div class="auth-logo">-->
            <!--                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" viewBox="0 0 24 24">-->
            <!--                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>-->
            <!--                    </svg>-->
            <!--                </div>-->
            <div class="d-flex justify-content-between align-items-center w-100">
                <div>
                    <h1 class="auth-title" data-i18n="index.welcome">Добро пожаловать в NeuroChat</h1>
                    <p class="auth-subtitle" data-i18n="index.subtitle">Войдите в свой аккаунт, чтобы продолжить</p>
                </div>
            </div>

            <div th:if="${param.error}" class="error-message">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span data-i18n="index.error">Неверный email или пароль. Пожалуйста, попробуйте снова.</span>
            </div>

            <div th:if="${param.logout}" class="success-message">
                <i class="bi bi-check-circle-fill"></i>
                <span data-i18n="index.loggedOut">Вы успешно вышли из системы.</span>
            </div>

            <p th:if="${message}" class="success-message">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${message}"></span>
            </p>
        </div>

        <form th:action="@{/perform_login}" method="post" class="auth-form">
            <div class="mb-3">
                <label for="email" class="form-label" data-i18n="index.email">Email</label>
                <input type="email" class="form-control" id="email" name="username" data-i18n-attr="placeholder" data-i18n="index.email.placeholder" placeholder="Введите ваш email" required>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label" data-i18n="index.password">Пароль</label>
                    <a th:href="@{/forgot-password}" class="forgot-password text-decoration-none">
                        <i class="bi bi-question-circle me-1 small"></i><span data-i18n="index.forgot">Забыли пароль?</span>
                    </a>
                </div>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                <label class="form-check-label" for="remember-me" data-i18n="index.remember">
                    Запомнить меня на этом устройстве
                </label>
            </div>

            <button type="submit" class="btn btn-primary mb-3" data-i18n="index.login">Войти</button>

            <div class="divider" data-i18n="index.or">или продолжить с помощью</div>

            <div class="social-login">
                <button type="button" class="social-btn">
                    <i class="bi bi-google"></i> <span data-i18n="index.google">Google</span>
                </button>
                <button type="button" class="social-btn">
                    <i class="bi bi-facebook"></i> <span data-i18n="index.facebook">Facebook</span>
                </button>
            </div>
        </form>

        <div class="auth-footer">
            <span data-i18n="index.noAccount">Ещё нет аккаунта?</span> <a href="/registration" data-i18n="index.register">Зарегистрируйтесь</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- i18n must load after DOM but before usage -->
<script th:src="@{/js/i18n.js}"></script>
</body>
</html>
