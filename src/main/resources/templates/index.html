<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в ИИ чат</title>
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/index.css}" rel="stylesheet" />
</head>

<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <!--                <div class="auth-logo">-->
            <!--                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" viewBox="0 0 24 24">-->
            <!--                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>-->
            <!--                    </svg>-->
            <!--                </div>-->
            <h1 class="auth-title">Добро пожаловать</h1>
            <p class="auth-subtitle">Войдите в свой аккаунт, чтобы продолжить</p>

            <div th:if="${param.error}" class="error-message">
                <i class="bi bi-exclamation-circle-fill"></i>
                Неверный email или пароль. Пожалуйста, попробуйте снова.
            </div>

            <div th:if="${param.logout}" class="success-message">
                <i class="bi bi-check-circle-fill"></i>
                Вы успешно вышли из системы.
            </div>

            <p th:if="${message}" class="success-message">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${message}"></span>
            </p>
        </div>

        <form th:action="@{/perform_login}" method="post" class="auth-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="username" placeholder="Введите ваш email" required>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label">Пароль</label>
                </div>
                <input type="password" class="form-control" id="password" name="password" required>
                <!--                    <a href="#" class="forgot-password">Забыли пароль?</a>-->
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                <label class="form-check-label" for="remember-me">
                    Запомнить меня
                </label>
            </div>

            <button type="submit" class="btn btn-primary mb-3">Войти</button>

            <div class="divider">или продолжить с помощью</div>

            <div class="social-login">
                <button type="button" class="social-btn">
                    <i class="bi bi-google"></i> Google
                </button>
                <button type="button" class="social-btn">
                    <i class="bi bi-github"></i> GitHub
                </button>
            </div>
        </form>

        <div class="auth-footer">
            Ещё нет аккаунта? <a href="/registration">Зарегистрируйтесь</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
