<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="forgot.pageTitle">Восстановление пароля</title>
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/index.css}" rel="stylesheet" />
    <style>
        .reset-form {
            max-width: 450px;
            width: 100%;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            background-color: white;
            margin: 0 auto;
        }
        .form-icon {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .form-icon i {
            font-size: 3rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reset-form">
                    <div class="form-icon">
                        <i class="bi bi-envelope-exclamation"></i>
                    </div>

                    <h2 class="text-center mb-4" data-i18n="forgot.heading">Восстановление пароля</h2>

                    <!-- Сообщение об успешной отправке -->
                    <div th:if="${param.sent != null && success != null}" class="alert alert-success mb-4" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}" data-i18n="forgot.success">Email с инструкциями отправлен.</span>
                    </div>

                    <!-- Сообщение об ошибке -->
                    <div th:if="${error != null}" class="alert alert-danger mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}" data-i18n="forgot.error">Произошла ошибка.</span>
                    </div>

                    <p class="text-muted mb-4" data-i18n="forgot.intro">
                        Введите email, указанный при регистрации, и мы отправим вам ссылку для сброса пароля.
                    </p>

                    <form th:action="@{/forgot-password}" method="post" th:object="${forgotPasswordRequest}">
                        <div class="mb-4">
                            <label for="email" class="form-label" data-i18n="forgot.email">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" th:field="*{email}" 
                                       data-i18n="forgot.email.placeholder" data-i18n-attr="placeholder" placeholder="Введите ваш email" required>
                            </div>
                            <div class="text-danger mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg" data-i18n="forgot.submit">Отправить</button>
                            <a th:href="@{/login}" class="btn btn-outline-secondary" data-i18n="forgot.backToLogin">Вернуться к входу</a>
                        </div>
                    </form>
                </div>
    </div>

    <script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
    <script th:src="@{/js/i18n.js}"></script>
</body>
</html>
