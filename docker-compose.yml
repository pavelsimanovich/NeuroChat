  db:
    container_name: mysql
    image: mysql
    restart: always
    networks:
      - mynetwork
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
    ports:
      - '3306:3306'
    volumes:
      - "db:/var/lib/mysql"
      - "./db/init.sql:/docker-entrypoint-initdb.d/1.sql"

networks:
  mynetwork: {}
    
volumes:
  db:
    driver: local
